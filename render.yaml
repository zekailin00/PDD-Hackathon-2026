services:
  - type: web
    name: coprompt
    runtime: node
    plan: starter
    numInstances: 1
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TOKENROUTER_API_KEY
        sync: false
      - key: MEM0_API_KEY
        sync: false
      - key: ROOM_SIGNING_SECRET
        generateValue: true
